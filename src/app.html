<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
		/>
		<meta name="theme-color" content="#f4f1ec" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved appearance before first paint to avoid a light flash.
			(function () {
				try {
					var a = localStorage.getItem('vault.pref.appearance') || 'system';
					var dark =
						a === 'dark' ||
						(a === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) m.setAttribute('content', dark ? '#16181a' : '#f4f1ec');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
